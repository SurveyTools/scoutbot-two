[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutbot"
version = "0.2.0"
description = "The computer vision for Wild Me's Scout project"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Wild Me", email = "dev@wildme.org"}
]
dependencies = [
    "click",
    "dill>=0.4.0",
    "numpy",
    "opencv-python-headless>=4.7.0",
    "requests",
    "rich",
    "sahi==0.11.36",
    "scikit-image>=0.21.0",
    "tqdm",
    "ultralytics==8.2.103",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-random-order",
    "ruff",
    "mypy",
]
all = [
    "pytest",
    "pytest-cov",
    "pytest-random-order",
    "ruff",
    "mypy",
]
docs = [
    "Sphinx>=5,<6",
    "sphinx-rtd-theme",
    "sphinx-click",
]
# Core ML inference (Apple Neural Engine) on macOS. Ultralytics imports coremltools
# at inference time to run .mlpackage models; gated to Darwin to keep Linux installs clean.
coreml = [
    "coremltools ; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/SurveyTools/scoutbot-2026"

[project.scripts]
scoutbot = "scoutbot.scoutbot:cli"

[tool.setuptools]
packages = ["scoutbot", "scoutbot.loc", "scoutbot.tile_batched"]
include-package-data = true

[tool.pytest.ini_options]
minversion = "5.4"
addopts = "-v --durations-min=1.0 --color=yes -ra"
testpaths = ["tests"]
filterwarnings = ["default"]
markers = [
    "slow: marks tests that download models or run real inference (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E201",  # whitespace after '('
    "E202",  # whitespace before ')'
    "E203",  # whitespace before ':'
    "E221",  # multiple spaces before operator
    "E222",  # multiple spaces after operator
    "E241",  # multiple spaces after ','
    "E265",  # block comment should start with '# '
    "E271",  # whitespace around keyword
    "E272",  # whitespace around keyword
    "E301",  # expected 1 blank line
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "single"
