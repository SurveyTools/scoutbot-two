[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutbot"
version = "0.2.0"
description = "The computer vision for Wild Me's Scout project"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Wild Me", email = "dev@wildme.org"}
]
dependencies = [
    "click",
    "dill>=0.4.0",
    "numpy",
    "opencv-python-headless>=4.7.0",
    "requests",
    "rich",
    "sahi==0.11.36",
    "scikit-image>=0.21.0",
    "tqdm",
    "ultralytics==8.2.103",
]

[project.optional-dependencies]
test = [
    "pytest >= 6.2.2",
    "pycodestyle",
    "pytest-cov",
]
all = [
    "pytest >= 6.2.2",
    "pycodestyle",
    "pytest-cov",
]
# Core ML inference (Apple Neural Engine) on macOS. Ultralytics imports coremltools
# at inference time to run .mlpackage models; gated to Darwin to keep Linux installs clean.
coreml = [
    "coremltools ; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/SurveyTools/scoutbot-2026"

[project.scripts]
scoutbot = "scoutbot.scoutbot:cli"

[tool.setuptools]
packages = ["scoutbot", "scoutbot.loc", "scoutbot.tile_batched"]
include-package-data = true

[tool.pytest.ini_options]
minversion = "5.4"
addopts = "-v --durations-min=1.0 --color=yes -ra"
testpaths = ["tests"]
filterwarnings = ["default"]

[tool.flake8]
ignore = ["D100", "D101", "D102", "D103", "D105", "D200", "D205", "D210", "D400", "D401", "D403", "E127", "E201", "E202", "E203", "E221", "E222", "E241", "E265", "E271", "E272", "E301", "E501", "N802", "N803", "N805", "N806", "W503"]
exclude = [".git"]

[tool.brunette]
line-length = 90
verbose = false
skip-string-normalization = true
single-quotes = true

[tool.isort]
profile = "black"
line_length = 90
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
