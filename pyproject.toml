[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutbot"
version = "0.2.0"
description = "The computer vision for Wild Me's Scout project ... and beyond"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Rebel Workflow Team"},
    {name = "Wild Me"}
]
dependencies = [
    "click",
    # >=2.1 required for Python 3.13: numpy 1.26.x has no stable 3.13 build and
    # its native init access-violates on the Windows 3.13 runner (windows-smoke).
    "numpy>=2.1",
    # sahi and ultralytics both depend on opencv-python (GUI build); this overrides
    # them with the headless build so CI and server environments without a display work.
    "opencv-python-headless>=4.7.0",
    "requests",
    "rich",
    "sahi==0.11.36",
    "tqdm",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
all = [
    "scoutbot[test]",
    "scoutbot[docs]",
    "scoutbot[coreml]",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-random-order",
    # Pinned exactly: ruff's format/lint output is version-sensitive (e.g. 0.16
    # made Markdown code-block formatting default), so an unpinned range let CI
    # drift ahead of the lock. Bump deliberately.
    "ruff==0.16.0",
    "mypy",
    "bandit",
]
docs = [
    "Sphinx>=7,<9",
    "sphinx-rtd-theme>=2.0",
    "sphinx-click>=4.0",
]
# Core ML inference (Apple Neural Engine) on macOS. Ultralytics imports coremltools
# at inference time to run .mlpackage models; gated to Darwin to keep Linux installs clean.
coreml = [
    "coremltools>=9.0 ; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/SurveyTools/scoutbot-2026"

[project.scripts]
scoutbot = "scoutbot.scoutbot:cli"

[tool.setuptools]
packages = ["scoutbot", "scoutbot.loc", "scoutbot.tile_batched", "scoutbot.registry"]
include-package-data = true

[tool.pytest.ini_options]
minversion = "5.4"
addopts = "-v --durations-min=1.0 --color=yes -ra"
testpaths = ["tests"]
pythonpath = ["benchmarks", "tests", "tools"]
filterwarnings = ["default"]
markers = [
    "slow: marks tests that download models or run real inference (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py310"
# Planning/design docs hold illustrative code snippets, not maintained source.
# ruff >=0.16 formats Markdown code blocks by default, so exclude these dirs
# (previously these lived under docs/superpowers/, which ruff's older .md
# behavior left untouched).
extend-exclude = ["docs/plans", "docs/specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E201",  # whitespace after '('
    "E202",  # whitespace before ')'
    "E203",  # whitespace before ':'
    "E221",  # multiple spaces before operator
    "E222",  # multiple spaces after operator
    "E241",  # multiple spaces after ','
    "E265",  # block comment should start with '# '
    "E271",  # whitespace around keyword
    "E272",  # whitespace around keyword
    "E301",  # expected 1 blank line
    "E501",  # line too long (handled by formatter)
]

[tool.bandit]
# tests/ is excluded: pytest assertions (B101) are expected and not a security concern.
# B101 (assert_used) is skipped globally: the production asserts are internal invariants,
# not security gates; converting them to explicit raises is tracked as a code quality item.
exclude_dirs = ["tests"]
skips = ["B101"]

# Note: `uv audit` ignores live in .github/workflows/quality.yml (CLI flags);
# it does not read a [tool.uv.audit] table. See docs/roadmap.rst (top priority)
# for the torch 2.13 upgrade that clears them.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.ruff.format]
quote-style = "single"
