[metadata]
name = scoutbot
description = The computer vision for Wild Me's Scout project
version = attr: scoutbot.VERSION
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/SurveyTools/scoutbot-2026
author = Wild Me
author_email = dev@wildme.org,
license = MIT
license_file = LICENSE
project_urls =
    Source = https://github.com/SurveyTools/scoutbot-2026

[options]
packages = find:
platforms = any
include_package_data = True
python_requires = >=3.7

[options.entry_points]
console_scripts =
    scoutbot = scoutbot.scoutbot:cli

[bdist_wheel]
universal = 1

[aliases]
test=pytest

[options.extras_require]
test =
    pytest >= 6.2.2
    pycodestyle
    pytest-cov
all =
    %(test)s

