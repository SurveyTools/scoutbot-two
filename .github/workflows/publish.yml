# Release publishing via PyPI Trusted Publishing (OIDC) — no API tokens or repo secrets.
# The filename "publish.yml" and the environment names "pypi" / "testpypi" are registered as the
# trusted publisher on PyPI and TestPyPI; renaming either breaks publishing.
#
#   workflow_dispatch -> build -> smoke -> TestPyPI   (dry run)
#   push tag X.Y.Z    -> build -> smoke -> PyPI       (gated by the "pypi" environment reviewers)
#
# Both paths publish the exact artifacts built and smoke-tested in this run. Actions are pinned to
# commit SHAs (unlike the other workflows) because this is the one workflow that can publish.
name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # No cache in the release path: a poisoned cache must not reach published artifacts.
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with pyproject.toml would publish a version nobody tagged.
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$EXPECTED'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Check distribution metadata
        # Pinned like the actions above, so the release path has no floating tool versions.
        run: uvx twine==7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # Fresh venv outside any checkout, so only the built wheel is importable. Models are not
      # downloaded here: the release path must not depend on the model bucket being reachable.
      - name: Install wheel into a clean venv
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv "$RUNNER_TEMP/venv" --python "$PYTHON_VERSION"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl

      - name: Run installed CLI and imports
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED: ${{ needs.build.outputs.version }}
        run: |
          "$RUNNER_TEMP/venv/bin/scoutbot" --help
          test "$("$RUNNER_TEMP/venv/bin/scoutbot" --version)" = "scoutbot $EXPECTED"
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import os
          import scoutbot, scoutbot.loc, scoutbot.registry, scoutbot.tile_batched
          assert scoutbot.__version__ == os.environ['EXPECTED'], (scoutbot.__version__, os.environ['EXPECTED'])
          print('scoutbot', scoutbot.__version__, 'OK')
          EOF

  publish-testpypi:
    needs: smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/scoutbot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: smoke
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/scoutbot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
