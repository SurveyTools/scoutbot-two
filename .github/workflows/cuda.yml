name: CUDA

# Real-GPU validation for the paths GitHub-hosted runners cannot cover: cuda:0
# inference (the slow suite) and the Linux/CUDA-first multiprocess batch mode.
#
# GitHub-hosted runners have no GPU, so this targets a SELF-HOSTED runner labelled
# `self-hosted, linux, gpu`. It is deliberately NOT wired to every push/PR — it runs
# on demand (workflow_dispatch) and weekly, to keep GPU time under control. Attach a
# GPU runner with those labels and the job runs; the "Assert a CUDA GPU" step fails
# fast if the runner has no visible device.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    env:
      # Make cuda:0 the default inference device for pipeline/batch runs.
      SCOUTBOT_DEVICE: "cuda:0"
      # Conservative batch size so the job fits on modest GPUs; raise per-runner if desired.
      DETECTOR_BATCH_SIZE: "32"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # example images are stored in Git LFS

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies (CUDA torch on Linux)
        run: uv sync --extra test

      - name: Assert a CUDA GPU is present
        run: |
          uv run python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "No CUDA GPU visible on this runner"
          print("CUDA device:", torch.cuda.get_device_name(0))
          print("torch:", torch.__version__)
          PY

      - name: Slow suite on GPU (real cuda:0 inference)
        run: uv run pytest -m slow -v

      - name: Multiprocess batch mode on GPU (production path)
        run: |
          uv run scoutbot batch-resumable examples/*.jpg \
            -o mp.jsonl --processes 2 --summary-json mp-summary.json

      - name: Concurrency benchmark (informational)
        run: |
          uv run python benchmarks/benchmark_concurrency.py \
            --modes sequential multiprocess --processes 2 \
            --summary-json bench-concurrency.json

      - name: Publish run summaries to job summary
        if: always()
        run: |
          {
            echo '## CUDA run summaries'
            echo '### batch-resumable --processes 2'
            echo '```json'; cat mp-summary.json 2>/dev/null || echo '(missing)'; echo '```'
            echo '### benchmark_concurrency (sequential vs multiprocess)'
            echo '```json'; cat bench-concurrency.json 2>/dev/null || echo '(missing)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
